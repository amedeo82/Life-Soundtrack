name: auto-state-aggregate

# Rigenera i blocchi aggregati in docs/SESSIONS.md + docs/11-BACKLOG.md + docs/INDEX.md + docs/BUNDLE.md + README.md
# dopo un merge su `main`. Risolve la classe di conflitti di merge ricorrenti
# quando più agenti paralleli fanno doc-sync IN PR (D.21.1): invece di N PR che
# modificano direttamente i file globali, ogni PR modifica solo docs/state/ e la
# GH Action lo aggrega automaticamente su `main`.
#
# NB (issue #136): l'elenco dei path in `git add` DEVE contenere TUTTI i `$targets`
# di scripts/aggregate-state.ps1. La lista tenuta qui e la lista tenuta li'
# descrivevano lo stesso insieme di file senza nessun gate che le confrontasse:
# quando ADR-0008 V3 (issue #127) ha aggiunto README.md come quinto target, il
# workflow ha continuato a generare il blocco NEXT-STEP e a scartarlo (mai
# committato). Il gate e' ora `scripts/validate-workflows.mjs` (bloccante in CI,
# vedi `docs/12-DEVOPS.md` 9.8c).
#
# Non-bloccante: se l'aggregator fallisce, il workflow logga un warning ma lascia
# il merge andare. Lo stato può essere riallineato manualmente.
# Pattern analogo: auto-status-done.yml (S19/D2).

on:
  push:
    branches: [main]
    paths:
      - 'docs/state/**/*.md'
      - 'scripts/aggregate-state.ps1'

# Companion di auto-bundle.yml: condividono il group post-merge-main con
# cancel-in-progress: false, cosi' le due rigenerazioni (blocchi AGGREGATE-*
# vs sezioni FILE di BUNDLE.md) sono serializzate. Vedi auto-bundle.yml per
# il caso d'uso che ha motivato questa aggiunta (issue #115, follow-up di
# PR #113).
#
# ATTENZIONE (issue #140): la serializzazione da sola NON basta. Il group
# serializza i *run*, non i *checkout*: senza lo step "Sync con origin/main"
# qui sotto, questa workflow fa checkout del `github.sha` del merge commit,
# mentre l'altra puo' aver gia' pushato un commit sopra: `git push origin main`
# fallisce con `non-fast-forward` e i blocchi aggregati non vengono committati.
# Sintesi e gate di regressione: `scripts/test-workflow-push-sync.sh`.
concurrency:
  group: post-merge-main
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Necessario per il push finale
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Issue #140: questa workflow e `auto-bundle.yml` scattano sullo STESSO
      # push a `main` e condividono il concurrency group `post-merge-main`, ma il
      # group serializza i *run*, non i *checkout*: `actions/checkout` senza
      # `ref:` mette il workspace sul `github.sha` del merge commit, non sulla
      # testa corrente di `main`. Se l'altra workflow ha gia' pushato quando
      # questa parte, `git push origin main` viene rifiutato con
      # `! [rejected] main -> main (non-fast-forward)` (run 39803721229,
      # 2026-10-22T15:19:20Z) e i blocchi aggregati restano indietro — cioe' il
      # meccanismo di auto-guarimento di ADR-0008 resta spento.
      # Lo step e' identico a quello di `auto-bundle.yml`: fetch + rebase, con
      # fallback a `reset --hard` (l'aggregator non lascia dirty state).
      # Gate di regressione: `scripts/test-workflow-push-sync.sh`.
      - name: Sync con origin/main
        shell: pwsh
        run: |
          git fetch origin main
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Rebase fallito, fallback a git reset --hard origin/main"
            git reset --hard origin/main
          }

      - name: Run aggregator in check mode first
        shell: pwsh
        run: |
          Write-Host "::group::Pre-merge check (-Check)"
          pwsh scripts/aggregate-state.ps1 -Check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Aggregator reported drift (exit=$LASTEXITCODE). Proceeding with auto-apply."
          }
          # Issue #58 fix: explicit exit 0 after warning. Without this, GitHub
          # marks the step as 'failure' (exit 1 from pwsh), which (combined with
          # missing if: always() on the diff step) prevented the auto-commit.
          exit 0

      - name: Apply aggregator
        if: always()
        shell: pwsh
        run: |
          Write-Host "::group::Applying aggregator (default write mode)"
          pwsh scripts/aggregate-state.ps1

      - name: Check git diff
        if: always()  # Issue #58 fix: must run even if check step reports drift
        id: diff
        shell: pwsh
        run: |
          $diff = git diff --name-only
          if ($diff) {
            Write-Host "Files modified by aggregator:"
            $diff | ForEach-Object { Write-Host "  - $_" }
            "modified=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "No diff: aggregator output is already in sync."
            "modified=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Commit and push
        if: steps.diff.outputs.modified == 'true'
        shell: pwsh
        run: |
          git config user.name "kilo-bot[bot]"
          git config user.email "kilo-bot@kilo.local"
          # Issue #60 fix: PowerShell parse error su `git diff --cached --quiet && (Write-Host; exit 0)`.
          # Sintassi bash, non valida in pwsh 7+ su Linux. Riscritta con if + early exit.
          # Anche `2>$null` (bash) sostituito con `2>&1 | Out-Null` (PowerShell).
          git add docs/SESSIONS.md docs/11-BACKLOG.md docs/INDEX.md docs/BUNDLE.md README.md scripts/aggregate-state.ps1 docs/state/ 2>&1 | Out-Null
          if (git diff --cached --quiet) {
            Write-Host "Nothing to commit (staged diff is empty)"
            exit 0
          }
          git commit -m "chore(state): auto-aggregate from docs/state/ (ADR-0008 V2)" `
                       -m "Triggered by .github/workflows/auto-state-aggregate.yml on push to main." `
                       -m "Source: docs/state/sessions/*.md + docs/state/stories/*.md (frontmatter)." `
                       -m "Target blocks:" `
                       -m "  - docs/SESSIONS.md: <!-- AGGREGATE-SESSIONS-{START,END} -->" `
                       -m "  - docs/11-BACKLOG.md: <!-- AGGREGATE-STORIES-{START,END} -->" `
                       -m "  - docs/INDEX.md: <!-- AGGREGATE-INDEX-STATUS-{START,END} -->" `
                       -m "  - docs/INDEX.md: <!-- AGGREGATE-INDEX-ROADMAP-{START,END} -->" `
                       -m "  - docs/BUNDLE.md: <!-- AGGREGATE-BUNDLE-INVENTORY-{START,END} -->" `
                       -m "  - README.md: <!-- AGGREGATE-NEXT-STEP-{START,END} -->" `
                       -m "" `
                       -m "Skips if aggregator output already in sync."
          git push origin main
