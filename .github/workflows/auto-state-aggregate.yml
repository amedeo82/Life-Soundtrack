- name: Commit and push
        if: steps.diff.outputs.modified == 'true'
        shell: pwsh
        run: |
          git config user.name "kilo-bot[bot]"
          git config user.email "kilo-bot@kilo.local"
          # V2 (issue #52) + PowerShell parse fix (issue #60) merged during rebase #53 → #62 → #52.
          # V2: include INDEX.md + BUNDLE.md in git add + commit message.
          # #60: PowerShell syntax (2>&1 | Out-Null, if (...) {...}, backtick line continuation).
          git add docs/SESSIONS.md docs/11-BACKLOG.md docs/INDEX.md docs/BUNDLE.md scripts/aggregate-state.ps1 docs/state/ 2>&1 | Out-Null
          if (git diff --cached --quiet) {
            Write-Host "Nothing to commit (staged diff is empty)"
            exit 0
          }
          git commit -m "chore(state): auto-aggregate from docs/state/ (ADR-0008 V2)" `
                       -m "Triggered by .github/workflows/auto-state-aggregate.yml on push to main." `
                       -m "Source: docs/state/sessions/*.md + docs/state/stories/*.md (frontmatter)." `
                       -m "Target blocks (V2):" `
                       -m "  - docs/SESSIONS.md: <!-- AGGREGATE-SESSIONS-{START,END} -->" `
                       -m "  - docs/11-BACKLOG.md: <!-- AGGREGATE-STORIES-{START,END} -->" `
                       -m "  - docs/INDEX.md: <!-- AGGREGATE-INDEX-STATUS-{START,END} -->" `
                       -m "  - docs/INDEX.md: <!-- AGGREGATE-INDEX-ROADMAP-{START,END} -->" `
                       -m "  - docs/BUNDLE.md: <!-- AGGREGATE-BUNDLE-INVENTORY-{START,END} -->" `
                       -m "" `
                       -m "Skips if aggregator output already in sync."
          git push origin main
